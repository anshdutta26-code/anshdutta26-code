name: Build profile portrait

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_portrait.py'
      - '.github/workflows/portrait.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portrait:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          path: profile

      - name: Checkout website source portrait
        uses: actions/checkout@v4
        with:
          repository: anshdutta26-code/anshdutta26-code.github.io
          ref: website-build
          path: website

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check Pillow opencv-python-headless

      - name: Generate dark and light animated dot-matrix portraits
        run: |
          python profile/scripts/build_portrait.py \
            website/assets/images/about-portrait.webp \
            profile/assets/portrait-dark.svg \
            --cols 100 \
            --theme dark

          python profile/scripts/build_portrait.py \
            website/assets/images/about-portrait.webp \
            profile/assets/portrait-light.svg \
            --cols 100 \
            --theme light

          # Keep the original filename as a stable dark-mode fallback for any old links.
          cp profile/assets/portrait-dark.svg profile/assets/portrait.svg

      - name: Commit generated portraits
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait.svg assets/portrait-dark.svg assets/portrait-light.svg
          if git diff --cached --quiet; then
            echo "Portrait variants are already up to date."
          else
            git commit -m "Regenerate light and dark dot-matrix portraits"
            git push
          fi
